name: Restore word fields

# An installed copy from before `tip` existed still rebuilds words.json
# without fields it does not know. That push is already on main by the time
# this runs, so put the missing fields back. The app itself refuses the same
# write once it is updated.
on:
  push:
    branches: [main]
    paths:
      - words.json

permissions:
  contents: write

concurrency:
  group: restore-word-fields
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put back fields an older copy removed
        run: node scripts/restore-word-fields.js
